plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'dev.starpad.calculatorforwear'
    compileSdk = 37

    defaultConfig {
        applicationId = 'dev.starpad.calculatorforwear'
        minSdk = 30
        targetSdk = 37
        versionCode = 4
        versionName = '1.1'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    signingConfigs {
        // Falls back to the debug keystore so assembleRelease produces an installable
        // APK out of the box. Drop a gitignored keystore.properties next to
        // settings.gradle to sign with the real upload key instead.
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) { propsFile.withInputStream { props.load(it) } }
            storeFile file(props.getProperty('storeFile',
                    "${System.getProperty('user.home')}/.android/debug.keystore"))
            storePassword props.getProperty('storePassword', 'android')
            keyAlias      props.getProperty('keyAlias', 'androiddebugkey')
            keyPassword   props.getProperty('keyPassword', 'android')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        compose = true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.wear.compose:compose-foundation:1.6.2'
    implementation 'androidx.wear.compose:compose-material3:1.6.2'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.wear:wear:1.4.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'net.objecthunter:exp4j:0.4.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
